<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c9a27a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>🍙</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#c9a27a;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;outline:none;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#fallback{display:none;position:fixed;inset:0;background:#c9a27a}
#fallbackImg{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;
  -webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fallback"><img id="fallbackImg" alt="" src="fallback.jpg"></div>
<script>
(function(){
  function stop(e){ if (e.cancelable) e.preventDefault(); }
  ['gesturestart','gesturechange','gestureend','contextmenu','dblclick','selectstart','dragstart'].forEach(function(t){
    document.addEventListener(t, stop, {passive:false});
  });
  document.addEventListener('touchmove', stop, {passive:false});
  document.addEventListener('touchstart', function(e){ if (e.touches && e.touches.length > 1) stop(e); }, {passive:false});
  var lastEnd = 0;
  document.addEventListener('touchend', function(e){ var n = Date.now(); if (n - lastEnd < 350) stop(e); lastEnd = n; }, {passive:false});
})();
</script>
<!-- dev: missing files simply 404 and are skipped -->

<script src="scenes_b.js"></script>
<script src="main.js"></script>
</body>
</html>
